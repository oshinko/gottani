<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="長さと文字種を選んで、ブラウザー内でランダムなパスワードを生成できるツールです。生成したパスワードは外部に送信されません。">
  <title>パスワード生成 — gottani</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, -apple-system, sans-serif; }
    body { max-width: 560px; margin: 8vh auto; padding: 0 20px; line-height: 1.6; }
    h1 { font-size: 1.5rem; }
    a { color: LinkText; text-underline-offset: .2em; }
    input, select, textarea, button { padding: 10px; font: inherit; border: 1px solid #888; border-radius: 6px; }
    select { display: block; width: 100%; margin-top: 8px; }
    #custom-length-field { margin-top: 12px; }
    #custom-length, #count { width: 6em; margin-left: 8px; }
    fieldset { margin: 20px 0; padding: 12px 16px; border: 1px solid #888; border-radius: 6px; }
    fieldset label { display: block; margin: 6px 0; }
    button { cursor: pointer; }
    button:disabled { cursor: default; opacity: .6; }
    .output-label { display: block; margin: 24px 0 8px; font-weight: 600; }
    .field { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 8px; }
    #password { flex: 1; min-width: 0; font-family: ui-monospace, monospace; resize: vertical; }
    #status { min-height: 1.6em; }
    .note { font-size: .9rem; opacity: .75; }
    footer { margin-top: 32px; font-size: .9rem; }
    footer a { color: inherit; text-underline-offset: .2em; }
  </style>
</head>
<body>
  <main>
    <h1>パスワード生成</h1>
    <p>長さと文字種を選んで、ランダムなパスワードを生成します。</p>
    <form id="form">
      <label for="length">文字数</label>
      <select id="length" aria-describedby="length-note">
        <option value="8">8文字</option>
        <option value="15" selected>15文字</option>
        <option value="16">16文字</option>
        <option value="20">20文字</option>
        <option value="24">24文字</option>
        <option value="32">32文字</option>
        <option value="64">64文字</option>
        <option value="128">128文字</option>
        <option value="custom">任意の文字数</option>
      </select>
      <div id="custom-length-field" hidden>
        <label for="custom-length">文字数（8〜128）</label>
        <input id="custom-length" type="number" min="8" max="128" step="1" value="15" required disabled>
      </div>
      <p id="length-note" class="note"><a href="https://pages.nist.gov/800-63-4/sp800-63b.html#passwordver">NIST SP 800-63B-4</a> の最低文字数は、単要素認証では15文字、多要素認証の一部として使う場合は8文字です。</p>
      <label for="count">生成する個数（1〜100）</label>
      <input id="count" type="number" min="1" max="100" step="1" value="1" required>
      <fieldset>
        <legend>使用する文字種（1つ以上）</legend>
        <label><input type="checkbox" name="charset" value="uppercase" checked> 英大文字（A–Z）</label>
        <label><input type="checkbox" name="charset" value="lowercase" checked> 英小文字（a–z）</label>
        <label><input type="checkbox" name="charset" value="digits" checked> 数字（0–9）</label>
        <label><input type="checkbox" name="charset" value="symbols" checked> 記号（!@#$%&amp;*+-=?_）</label>
      </fieldset>
      <fieldset>
        <legend>オプション</legend>
        <label><input id="exclude-ambiguous" type="checkbox"> 紛らわしい文字は省く（<code>0 O o 1 I l</code>）</label>
      </fieldset>
      <button type="submit">生成する</button>
    </form>
    <label class="output-label" for="password">生成したパスワード</label>
    <div class="field">
      <textarea id="password" rows="1" wrap="off" readonly autocomplete="off" spellcheck="false" autocapitalize="off" aria-describedby="output-note"></textarea>
      <button id="copy" type="button" disabled>コピー</button>
    </div>
    <p id="output-note" class="note">1行に1個ずつ表示します。コピーすると全行をまとめてコピーします。</p>
    <p id="status" role="status" aria-live="polite"></p>
    <p class="note">選択した文字種をそれぞれ1文字以上含みます。設定はこのブラウザーに保存します。ブラウザーの暗号学的乱数を使い、生成したパスワードは外部に送信・保存しません。</p>
  </main>
  <footer>
    <a href="index.html">← ツール一覧に戻る</a>
  </footer>
  <script>
    const charsets = {
      uppercase: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
      lowercase: 'abcdefghijklmnopqrstuvwxyz',
      digits: '0123456789',
      symbols: '!@#$%&*+-=?_'
    };
    const form = document.querySelector('#form');
    const lengthSelect = document.querySelector('#length');
    const customLengthField = document.querySelector('#custom-length-field');
    const customLengthInput = document.querySelector('#custom-length');
    const countInput = document.querySelector('#count');
    const excludeAmbiguous = document.querySelector('#exclude-ambiguous');
    const output = document.querySelector('#password');
    const copyButton = document.querySelector('#copy');
    const status = document.querySelector('#status');
    const charsetInputs = [...form.querySelectorAll('input[name="charset"]')];
    const settingsKey = 'gottani.password-generator.settings.v1';

    function restoreSettings() {
      try {
        const settings = JSON.parse(localStorage.getItem(settingsKey));
        if (!settings || typeof settings !== 'object' || Array.isArray(settings)) return;
        if ([...lengthSelect.options].some(option => option.value === settings.length)) {
          lengthSelect.value = settings.length;
        }
        if (Number.isInteger(settings.customLength) && settings.customLength >= 8 && settings.customLength <= 128) {
          customLengthInput.value = settings.customLength;
        }
        if (Number.isInteger(settings.count) && settings.count >= 1 && settings.count <= 100) {
          countInput.value = settings.count;
        }
        if (Array.isArray(settings.charsets) && settings.charsets.every(value => charsetInputs.some(input => input.value === value))) {
          charsetInputs.forEach(input => { input.checked = settings.charsets.includes(input.value); });
        }
        if (typeof settings.excludeAmbiguous === 'boolean') {
          excludeAmbiguous.checked = settings.excludeAmbiguous;
        }
      } catch {
        // 保存データが壊れている場合や、ストレージが使えない場合は初期値で続行する。
      }
    }

    function saveSettings() {
      try {
        localStorage.setItem(settingsKey, JSON.stringify({
          length: lengthSelect.value,
          customLength: customLengthInput.valueAsNumber,
          count: countInput.valueAsNumber,
          charsets: charsetInputs.filter(input => input.checked).map(input => input.value),
          excludeAmbiguous: excludeAmbiguous.checked
        }));
      } catch {
        // ストレージが使えなくてもパスワード生成は継続できる。
      }
    }

    form.addEventListener('input', saveSettings);
    form.addEventListener('change', saveSettings);

    function updateLengthField() {
      const custom = lengthSelect.value === 'custom';
      customLengthField.hidden = !custom;
      customLengthInput.disabled = !custom;
    }

    lengthSelect.addEventListener('change', () => {
      updateLengthField();
      if (!customLengthInput.disabled) customLengthInput.focus();
    });
    restoreSettings();
    updateLengthField();

    function randomIndex(size) {
      const range = 2 ** 32;
      const limit = range - (range % size);
      const buffer = new Uint32Array(1);
      do {
        crypto.getRandomValues(buffer);
      } while (buffer[0] >= limit);
      return buffer[0] % size;
    }

    function generatePassword(length, groups, excludeAmbiguous = false) {
      if (!Number.isInteger(length) || length < 8 || length > 128) {
        throw new Error('文字数は8〜128の整数で指定してください。');
      }
      if (!groups.length) throw new Error('文字種を1つ以上選択してください。');
      if (excludeAmbiguous) {
        groups = groups.map(group => [...group].filter(character => !'0Oo1Il'.includes(character)).join(''));
      }
      const characters = groups.join('');
      let password;
      do {
        password = Array.from({ length }, () => characters[randomIndex(characters.length)]).join('');
      } while (!groups.every(group => [...password].some(character => group.includes(character))));
      return password;
    }

    form.addEventListener('submit', event => {
      event.preventDefault();
      saveSettings();
      status.textContent = '';
      output.value = '';
      output.rows = 1;
      copyButton.disabled = true;
      copyButton.textContent = 'コピー';
      try {
        const count = countInput.valueAsNumber;
        if (!Number.isInteger(count) || count < 1 || count > 100) {
          throw new Error('生成する個数は1〜100の整数で指定してください。');
        }
        const groups = [...form.querySelectorAll('input[name="charset"]:checked')]
          .map(checkbox => charsets[checkbox.value]);
        const length = lengthSelect.value === 'custom' ? customLengthInput.valueAsNumber : Number(lengthSelect.value);
        const passwords = Array.from({ length: count }, () => generatePassword(length, groups, excludeAmbiguous.checked));
        output.value = passwords.join('\n');
        output.rows = Math.min(count, 10);
        copyButton.disabled = false;
        copyButton.textContent = count > 1 ? 'まとめてコピー' : 'コピー';
        status.textContent = `パスワードを${count}個生成しました。`;
      } catch (error) {
        status.textContent = error.message;
      }
    });

    copyButton.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(output.value);
        status.textContent = 'コピーしました。';
      } catch {
        output.focus();
        output.select();
        status.textContent = 'コピーできませんでした。選択したパスワードを手動でコピーしてください。';
      }
    });
  </script>
</body>
</html>
