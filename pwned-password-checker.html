<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="パスワードが既知の漏洩データに含まれているか確認できるツールです。パスワード自体は送信せず、SHA-1 ハッシュの先頭5文字だけを使って照会します。">
  <title>Pwned Passwords Checker</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, -apple-system, sans-serif; }
    body { max-width: 560px; margin: 8vh auto; padding: 0 20px; line-height: 1.6; }
    h1 { font-size: 1.5rem; }
    label { display: block; margin-bottom: 8px; font-weight: 600; }
    .field { display: flex; gap: 8px; }
    input { flex: 1; min-width: 0; padding: 11px; font: inherit; border: 1px solid #888; border-radius: 6px; }
    button { padding: 10px 16px; font: inherit; cursor: pointer; border: 1px solid #888; border-radius: 6px; }
    button:disabled { cursor: wait; opacity: .6; }
    #result { min-height: 1.5em; margin-top: 18px; font-weight: 600; }
    .bad { color: #c0392b; } .good { color: #16803c; } .error { color: #c0392b; }
    .note { font-size: .9rem; opacity: .75; }
    footer { margin-top: 32px; font-size: .9rem; }
    footer a { color: inherit; text-underline-offset: .2em; }
  </style>
</head>
<body>
  <h1>Pwned Passwords Checker</h1>
  <p>パスワードが既知の漏洩データに含まれているか確認します。</p>
  <form id="form">
    <label for="password">パスワード</label>
    <div class="field">
      <input id="password" type="password" autocomplete="off" required>
      <button id="toggle-password" type="button" aria-controls="password" aria-label="パスワードを表示">表示</button>
      <button id="check" type="submit">チェック</button>
    </div>
  </form>
  <p id="result" role="status" aria-live="polite"></p>
  <p class="note">パスワード自体は送信されません。SHA-1 ハッシュの先頭5文字だけを外部 API に送信します。未検出でも安全性を保証するものではありません。</p>

  <footer>
    <a href="index.html">← ツール一覧に戻る</a>
  </footer>
  <script>
    const form = document.querySelector('#form');
    const input = document.querySelector('#password');
    const togglePassword = document.querySelector('#toggle-password');
    const button = document.querySelector('#check');
    const result = document.querySelector('#result');

    togglePassword.addEventListener('click', () => {
      const visible = input.type === 'password';
      input.type = visible ? 'text' : 'password';
      togglePassword.textContent = visible ? '非表示' : '表示';
      togglePassword.setAttribute('aria-label', visible ? 'パスワードを非表示' : 'パスワードを表示');
    });

    async function checkPwnedPassword(password) {
      const bytes = new TextEncoder().encode(password);
      const digest = await crypto.subtle.digest('SHA-1', bytes);
      const hash = [...new Uint8Array(digest)]
        .map(byte => byte.toString(16).padStart(2, '0'))
        .join('').toUpperCase();
      const prefix = hash.slice(0, 5);
      const suffix = hash.slice(5);

      const response = await fetch(`https://api.pwnedpasswords.com/range/${prefix}`, {
        headers: { 'Add-Padding': 'true' }
      });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);

      const lines = (await response.text()).split(/\r?\n/);
      for (const line of lines) {
        const [candidate, count] = line.trim().split(':');
        if (candidate === suffix) return Number(count);
      }
      return 0;
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();
      result.textContent = '照会中…';
      result.className = '';
      button.disabled = true;
      try {
        const count = await checkPwnedPassword(input.value);
        if (count > 0) {
          result.textContent = `このパスワードは漏洩データに ${count.toLocaleString('ja-JP')} 回登場しています。使用を避けてください。`;
          result.className = 'bad';
        } else {
          result.textContent = '既知の漏洩データには見つかりませんでした（安全性を保証するものではありません）。';
          result.className = 'good';
        }
      } catch (error) {
        result.textContent = `確認できませんでした: ${error.message}`;
        result.className = 'error';
      } finally {
        button.disabled = false;
        input.value = '';
      }
    });
  </script>
</body>
</html>
